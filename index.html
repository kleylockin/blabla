<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you: a peony in bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1020; --bg2:#3a1b34; --ink:#f7dbe4; --line:rgba(247,219,228,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1020;--bg2:#3a1b34;--ink:#f7dbe4}}
:root[data-theme="dark"]{--bg:#1c1020;--bg2:#3a1b34;--ink:#f7dbe4}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0}
body{
  background:radial-gradient(120% 80% at 50% 38%,var(--bg2) 0%,var(--bg) 70%);
  background-color:var(--bg);
  
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:var(--ink);
  background-attachment:fixed;
}
svg{display:block;height:min(82vh,820px);max-width:100%;width:auto;aspect-ratio:2/3;justify-self:center;grid-column:1/-1;grid-row:1}
footer{padding:50px 20px 60px;text-align:center;font-style:italic;font-size:19px;opacity:.75;border-top:1px solid var(--line)}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) clamp(20px,6vw,90px) 18px;font-size:24px;font-style:italic}
nav div{display:flex;gap:26px}
nav a{color:var(--ink);text-decoration:none;font-style:normal;font-size:18px;opacity:.8}
nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hero{min-height:100dvh;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:20px;padding:84px clamp(20px,6vw,90px) 30px}
.copy{grid-column:1;grid-row:1;max-width:31rem}
h1{font-size:clamp(44px,6.4vw,92px);line-height:1;font-weight:500;margin:0 0 .35em}
.copy p{font-size:clamp(19px,1.7vw,23px);line-height:1.5;opacity:.85;margin:0 0 1.4em}
.info{max-width:64rem;margin:0 auto;padding:clamp(60px,10vw,130px) clamp(20px,6vw,90px);border-top:1px solid var(--line)}
h2{font-size:clamp(32px,4vw,52px);font-weight:500;line-height:1.1;margin:0 0 .5em}
.info p{font-size:21px;line-height:1.6;max-width:38rem;opacity:.85;margin:0 0 1em}
dl{display:grid;grid-template-columns:minmax(0,13rem) 1fr;gap:26px 36px;margin:0}
dt{font-size:28px;font-style:italic}
dd{margin:0;font-size:20px;line-height:1.55;opacity:.85;max-width:36rem}
@media (max-width:820px){.hero{grid-template-columns:1fr;text-align:center;padding-top:70px}svg{grid-column:1;grid-row:1;height:58vh}.copy{grid-column:1;grid-row:2;margin:0 auto}dl{grid-template-columns:1fr;gap:6px}dd{margin-bottom:20px}nav div{gap:16px}}
/* ---------- scene ---------- */
button{
  font:inherit;color:var(--ink);background:none;border:1px solid var(--line);
  padding:7px 22px;border-radius:999px;cursor:pointer;transition:background .3s,border-color .3s;
}
button:hover{background:rgba(247,219,228,.1);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- scene ---------- */
.p{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0}
.go .p{animation:open 2.4s cubic-bezier(.22,.9,.28,1) var(--d) forwards}
@keyframes open{
  0%{transform:scale(0) rotate(-35deg);opacity:0}
  20%{opacity:1}
  100%{transform:scale(calc(var(--s)*var(--w)),var(--s)) rotate(0);opacity:1}
}
.stem{stroke-dasharray:1;stroke-dashoffset:1}
.go .stem{animation:draw 1.8s cubic-bezier(.4,.1,.2,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.leaf{transform-box:fill-box;transform-origin:0% 70%;transform:scale(0)}
.go .leaf{animation:leaf 1.6s cubic-bezier(.3,1.2,.4,1) var(--d) forwards}
@keyframes leaf{to{transform:scale(1)}}
.bud{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0)}
.go .bud{animation:bud 1.7s ease-in-out .9s both}
@keyframes bud{0%{transform:scale(0);opacity:1}55%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
.glow{opacity:0}
.go .glow{animation:fade 3s ease-out 2s forwards}
@keyframes fade{to{opacity:1}}
.sta{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.go .sta{animation:pop .7s cubic-bezier(.3,1.5,.5,1) var(--d) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.plant{transform-origin:200px 590px}
.go .plant{animation:sway 7s ease-in-out 5.5s infinite alternate}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
.fall{opacity:0}
.go .fall{animation:fall var(--t) ease-in var(--d) infinite}
@keyframes fall{
  0%{transform:translate(var(--x0),0) rotate(0);opacity:0}
  12%{opacity:.85}
  100%{transform:translate(var(--x1),340px) rotate(var(--r));opacity:0}
}
.tw{animation:tw var(--t) ease-in-out var(--d) infinite alternate;opacity:.1}
@keyframes tw{to{opacity:.7}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<nav><span>For you</span></nav>
<section class="hero">
<svg id="scene" viewBox="0 0 400 600" role="img" aria-label="A pink peony growing and blooming">
  <defs>
    <linearGradient id="g0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f1a6bd"/><stop offset=".55" stop-color="#fbd0dc"/><stop offset="1" stop-color="#fff1f4"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e98aa9"/><stop offset=".6" stop-color="#f7b9cb"/><stop offset="1" stop-color="#fde0e8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9608a"/><stop offset=".6" stop-color="#f09fbc"/><stop offset="1" stop-color="#f9c9d8"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b93d72"/><stop offset=".6" stop-color="#e2799f"/><stop offset="1" stop-color="#f4adc6"/></linearGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f5e45"/><stop offset="1" stop-color="#8fb08a"/></linearGradient>
    <radialGradient id="gl"><stop offset="0" stop-color="#ff9ec0" stop-opacity=".42"/><stop offset=".5" stop-color="#d9608a" stop-opacity=".15"/><stop offset="1" stop-color="#d9608a" stop-opacity="0"/></radialGradient>
    <path id="pet" d="M0,0 C-46,-26 -62,-86 -36,-116 C-30,-124 -22,-122 -16,-128 C-8,-134 -4,-124 0,-126 C4,-124 8,-134 16,-128 C22,-122 30,-124 36,-116 C62,-86 46,-26 0,0Z"/>
  </defs>

  <g id="sparkles"></g>
  <circle class="glow" cx="200" cy="250" r="230" fill="url(#gl)"/>
  <g id="falling"></g>

  <g class="plant">
    <path class="stem" pathLength="1" d="M200,592 C194,520 212,440 201,262" fill="none" stroke="#6f9170" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(203,470)"><path class="leaf" style="--d:.9s" d="M0,0 C30,-44 92,-56 140,-32 C110,12 44,28 0,0Z" fill="url(#lf)"/></g>
    <g transform="translate(198,400) scale(-1,1)"><path class="leaf" style="--d:1.15s" d="M0,0 C28,-40 84,-50 124,-28 C98,10 40,24 0,0Z" fill="url(#lf)"/></g>
    <g transform="translate(200,534) scale(-1,1)"><path class="leaf" style="--d:.7s" d="M0,0 C24,-30 66,-38 98,-22 C76,8 32,18 0,0Z" fill="url(#lf)" opacity=".9"/></g>
    <g transform="translate(200,262)">
      <ellipse class="bud" cx="0" cy="-16" rx="17" ry="24" fill="#e98aa9"/>
      <g id="flower"></g>
    </g>
  </g>
</svg>
</section>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("scene");
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  var seed=11;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

  // sparkles
  var sp=document.getElementById("sparkles");
  for(var i=0;i<34;i++){
    var c=el("circle",{cx:(rnd()*400).toFixed(1),cy:(rnd()*560).toFixed(1),r:(rnd()*1.4+.4).toFixed(2),fill:"#ffd9e4",class:"tw"},sp);
    c.style.setProperty("--t",(2+rnd()*4).toFixed(1)+"s");c.style.setProperty("--d",(-rnd()*5).toFixed(1)+"s");
  }

  // petals
  var fl=document.getElementById("flower");
  var rings=[
    {n:8,s:1.02,r:14,g:0},{n:8,s:.92,r:12,g:0},{n:7,s:.80,r:10,g:1},{n:7,s:.69,r:8,g:1},
    {n:6,s:.57,r:6,g:2},{n:6,s:.46,r:5,g:2},{n:5,s:.35,r:3,g:3},{n:4,s:.24,r:2,g:3}
  ];
  rings.forEach(function(R,i){
    for(var k=0;k<R.n;k++){
      var a=k*360/R.n+i*(180/R.n)+i*13+(rnd()-.5)*14;
      var g1=el("g",{transform:"rotate("+a.toFixed(1)+")"},fl);
      var g2=el("g",{transform:"translate(0,"+(-R.r*(.7+rnd()*.6)).toFixed(1)+")"},g1);
      var p=el("use",{href:"#pet"},null);
      var w=el("g",{},g2);
      var path=el("path",{d:document.getElementById("pet").getAttribute("d"),fill:"url(#g"+R.g+")",stroke:"rgba(150,40,90,.28)","stroke-width":".8",class:"p"},w);
      path.style.setProperty("--s",(R.s*(.93+rnd()*.14)).toFixed(3));
      path.style.setProperty("--w",(.92+rnd()*.28).toFixed(3));
      path.style.setProperty("--d",(1.5+i*.32+rnd()*.25).toFixed(2)+"s");
      // veins
      var v=el("g",{class:"p",fill:"none",stroke:"rgba(255,255,255,.28)","stroke-width":".8","stroke-linecap":"round"},g2);
      v.style.setProperty("--s",path.style.getPropertyValue("--s"));
      v.style.setProperty("--w",path.style.getPropertyValue("--w"));
      v.style.setProperty("--d",path.style.getPropertyValue("--d"));
      el("path",{d:"M0,-8 C0,-50 -1,-85 -2,-112"},v);
      el("path",{d:"M-2,-14 C-18,-44 -26,-76 -26,-100"},v);
      el("path",{d:"M2,-14 C18,-44 26,-76 26,-100"},v);
    }
  });

  // stamens
  var core=el("g",{},fl);
  for(var j=0;j<44;j++){
    var ang=rnd()*Math.PI*2,rad=Math.sqrt(rnd())*15;
    var s=el("circle",{cx:(Math.cos(ang)*rad).toFixed(1),cy:(Math.sin(ang)*rad-8).toFixed(1),r:(1.1+rnd()*1.3).toFixed(2),fill:rnd()>.4?"#ffd36b":"#fff0b5",class:"sta"},core);
    s.style.setProperty("--d",(4+rnd()*1.4).toFixed(2)+"s");
  }

  // falling petals
  var fa=document.getElementById("falling");
  for(var m=0;m<9;m++){
    var g=el("g",{transform:"translate("+(150+rnd()*100).toFixed(0)+",270)"},fa);
    var f=el("path",{d:"M0,0 C-8,-5 -11,-15 -6,-20 C-2,-23 2,-23 6,-20 C11,-15 8,-5 0,0Z",fill:"#f9bdd0",class:"fall"},g);
    f.style.setProperty("--x0",((rnd()-.5)*40).toFixed(0)+"px");
    f.style.setProperty("--x1",((rnd()-.5)*180).toFixed(0)+"px");
    f.style.setProperty("--r",((rnd()-.5)*720).toFixed(0)+"deg");
    f.style.setProperty("--t",(7+rnd()*5).toFixed(1)+"s");
    f.style.setProperty("--d",(6+m*1.4+rnd()*2).toFixed(1)+"s");
  }

  function play(){svg.classList.remove("go");void svg.getBoundingClientRect();svg.classList.add("go")}
  svg.addEventListener("click",play);
  play();
})();
</script>
</body>
</html>
